<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Calculator</title>
    <script src ="script.js"></script>
    <link rel="stylesheet" href="style.css">

</head>
<body>
<h2>Student Result Calculator</h2>

<input type="text" id="name" placeholder="Enter Student Name"><br><br>
<input type="number" id="math" placeholder="Enter Math Marks"><br><br> 
<input type="number" id="science" placeholder="Enter Science Marks"><br><br>
<input type="number" id="english" placeholder="Enter English Marks"><br><br>
<input type="number" id="history" placeholder="Enter History Marks"><br><br>
<input type="number" id="geography" placeholder="Enter Geography Marks"><br><br>
<input type="number" id="computer" placeholder="Enter Computer Marks"><br><br>
<input type ="number" id="art" placeholder="Enter Art Marks"><br><br>
<input type="number" id="social" placeholder="Enter Social Studies Marks"><br><br>

<button type="button" onclick="calculateResult()">Calculate Result</button>


<p id="Total"></p>
<p id="result"></p>

</body>
</html>
