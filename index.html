<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 1.5rem;
            max-width: 480px;
            margin: 0 auto;
        }

        input {
            width: 100%;
            padding: 0.5rem;
            margin: 0.25rem 0;
            box-sizing: border-box;
        }

        button {
            margin: 0.25rem 0.25rem 0.25rem 0;
            padding: 0.5rem 1rem;
        }

        #Total {
            margin-top: 1rem;
            font-weight: bold;
        }

        #result {
            margin-top: 0.25rem;
            font-style: italic;
        }

    </style>
</head>
<body>
    <h2>Simple Calculator</h2>

    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">

    <div>
        <button type="button" onclick="calculateResult('+')">Addition</button>
        <button type="button" onclick="calculateResult('-')">Substraction</button>
        <button type="button" onclick="calculateResult('*')">Multiplication</button>
        <button type="button" onclick="calculateResult('/')">Division</button>
    </div>

    <p id="result"></p>

    <script>
        function calculateResult(operator) {
            let num1 = Number(document.getElementById('num1').value);
            let num2 = Number(document.getElementById('num2').value);

            let Result;
            if (operator == '+') {
                Result = num1 + num2;
            } else if (operator == '-') {
                Result = num1 - num2;
            } else if (operator == '*') {
                Result = num1 * num2;
            } else if (operator == '/') {
                
            Result = num1 / num2;
            } 

             document.getElementById('result').innerHTML = "Result: " + Result;

        }
    </script>
</body>
</html>
